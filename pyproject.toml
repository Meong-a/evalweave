[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalweave"
version = "1.0.0"
description = "Model- and domain-agnostic benchmark framework for reproducible LLM evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
keywords = ["llm", "benchmark", "evaluation", "transformers", "peft"]

[project.optional-dependencies]
hf = ["torch", "transformers", "peft"]
yaml = ["PyYAML"]

[project.scripts]
evalweave = "group_llm_benchmark.cli:main"
gbench = "group_llm_benchmark.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

