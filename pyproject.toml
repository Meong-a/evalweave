[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalweave"
version = "1.2.2"
description = "Reproducible full-suite LLM benchmark framework for group evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
hf = ["torch", "transformers", "peft"]
yaml = ["PyYAML"]
ifeval = ["absl-py", "langdetect", "nltk", "immutabledict"]

[project.scripts]
evalweave = "group_llm_benchmark.cli:main"
gbench = "group_llm_benchmark.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
